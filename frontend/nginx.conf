# Review submissions only (POST); other methods get an empty key and are not limited.
map $request_method $review_limit_key {
  POST    $binary_remote_addr;
  default "";
}
# 20 quick submissions per IP, then one every 30 s: the same budget as the app throttler (20 per 10 min),
# but enforced once at the edge, however many backend instances run behind it.
limit_req_zone $review_limit_key zone=reviews:10m rate=2r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  # Case-insensitive, optional trailing slash: Express routes "/Reviews" and "/reviews/" to the same handler.
  location ~* ^/api/products/[^/]+/reviews/?$ {
    limit_req zone=reviews burst=19 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    # nginx is the edge: overwrite (not append) so clients cannot spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
